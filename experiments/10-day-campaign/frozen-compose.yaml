      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_BROKER_ID: "1"
      KAFKA_HEAP_OPTS: -Xms512m -Xmx1024m
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:29092
      KAFKA_NUM_PARTITIONS: "1"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
    healthcheck:
      test:
      - CMD-SHELL
      - kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1
      timeout: 10s
      interval: 10s
      retries: 30
      start_period: 40s
    image: confluentinc/cp-kafka:7.4.0@sha256:187dac6627e7906c350f5f8c982f80ce735ff1a0e571a20de6000a309a12ce63
    mem_limit: "2147483648"
    networks:
      default: null
    restart: "no"
    volumes:
    - type: volume
      source: kafka_data
      target: /var/lib/kafka/data
      volume: {}
  zookeeper:
    cpus: 0.5
    cpuset: 8-15
    environment:
      ZOOKEEPER_CLIENT_PORT: "2181"
      ZOOKEEPER_TICK_TIME: "2000"
    healthcheck:
      test:
      - CMD-SHELL
      - nc -z -w 2 localhost 2181
      timeout: 3s
      interval: 5s
      retries: 30
      start_period: 10s
    image: confluentinc/cp-zookeeper:7.4.0@sha256:90631f224b4397ecfb4e824e43d93e0e42656841c6d55ef635c49df3975260ae
    mem_limit: "1073741824"
    networks:
      default: null
    restart: "no"
    volumes:
    - type: volume
      source: zookeeper_data
      target: /var/lib/zookeeper/data
      volume: {}
    - type: volume
      source: zookeeper_log
      target: /var/lib/zookeeper/log
      volume: {}
