      dockerfile: Dockerfile
    cpus: 1
    cpuset: 8-15
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      CAMPAIGN_DEADLINE_EPOCH_MS: ASSIGNED_PER_RUN
      CAMPAIGN_RANDOM_SEED: "42"
      CAMPAIGN_START_MONOTONIC_NS: ASSIGNED_PER_RUN
      JAVA_OPTS: -Xms256m -Xmx1400m -XX:+UseContainerSupport -XX:+UseG1GC
      KAFKA_LISTENER_CONCURRENCY: "1"
      KAFKA_MAX_POLL_INTERVAL_MS: "14400000"
    image: gfshield-campaign-dls-bitflip:pilot-b38eff3
    logging:
      driver: json-file
      options:
        max-file: "5"
        max-size: 20m
    mem_limit: "2147483648"
    networks:
      default: null
    restart: "no"
    volumes:
    - type: bind
      source: /home/idscps/nicolas/G-FShield-experiment-10d/datasets
      target: /datasets
      read_only: true
      bind:
        create_host_path: true
    - type: bind
      source: /home/idscps/nicolas/G-FShield-experiment-10d/experiments/10-day-campaign/frozen-metrics-placeholder
