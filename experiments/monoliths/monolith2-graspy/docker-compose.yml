version: "3.9"

services:
  grasp-fs:
    build: .
    image: grasp-fs:latest
    container_name: grasp-fs
    environment:
      - PYTHONUNBUFFERED=1   # stdout sem buffer (logs aparecem na hora)
    volumes:
      - ./data:/data:ro      # datasets (somente leitura)
      - ./logs:/app/logs     # saída de logs CSV
    command: >
      -tr /data/erenoall-train.arff
      --validation /data/erenoall-validation.arff
      -ts /data/erenoall-test.arff
      --classifier CART
      --fs_algos ig,gr,su
      --neighborhoods vnd,rvnd
      --ls_ops iwss,iwssr,bitflip
      --rcl_size 30
      --subset_size 5
      --ls_iters 50
      --bitflip_tries 10
      --build_restarts 100
      --seed 42
      --delimiter ";"
      --fsync_logs 0
      --log_flush_every 50
      --log_all_iters 1
      --log_sys_metrics 1
      --run_timeout_seconds 7200
      --max_accepted_improvements 500
      --minimum_improvement 0.0001
      --campaign_id ${CAMPAIGN_ID:?CAMPAIGN_ID is required}
      --arm_id ${ARM_ID:?ARM_ID is required}
      --run_id ${RUN_ID:?RUN_ID is required}
      --final_metrics_file /app/logs/final-result.json
    cpus: 2.0
    mem_limit: 8g
    restart: "no"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
