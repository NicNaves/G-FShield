version: "3.9"

services:
  grasp-fs:
    build: .
    image: grasp-fs:latest
    container_name: grasp-fs
    environment:
      - PYTHONUNBUFFERED=1   # stdout sem buffer (logs aparecem na hora)
    volumes:
      - ./data:/data:ro      # datasets (somente leitura)
      - ./logs:/app/logs     # saída de logs CSV
    command: >
      -tr /data/erenoall.arff
      -ts /data/erenoall.arff
      --classifier J48
      --fs_algos ig,gr,su
      --neighborhoods vnd,rvnd
      --ls_ops iwss,iwssr,bitflip
      --rcl_size 30
      --subset_size 5
      --ls_iters 50
      --bitflip_tries 10
      --build_restarts 100
      --seed 42
      --delimiter ";"
      --fsync_logs 0
      --log_flush_every 50
      --log_all_iters 1
      --log_sys_metrics 1
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
